/* =========================================================  
   HISTORY PAGE  
   ========================================================= */  

.history-page {  
  min-height: 100vh;  
  padding-bottom: 40px;  
}  

.history-header {  
  position: sticky;  
  top: 0;  
  z-index: 20;  

  background: var(--surface, #ffffff);  
  border-bottom: 1px solid var(--border, #e5e7eb);  

  padding:  
    calc(14px + env(safe-area-inset-top))  
    16px  
    14px;  
}  

.history-header__top {  
  display: flex;  
  align-items: center;  
  justify-content: space-between;  
  gap: 12px;  
}  

.history-title {  
  font-size: 22px;  
  font-weight: 700;  
  margin: 0;  
}  

.history-subtitle {  
  margin-top: 3px;  
  color: var(--muted, #64748b);  
  font-size: 13px;  
}  

.history-container {  
  width: 100%;  
  max-width: 1000px;  
  margin: 0 auto;  
  padding: 16px;  
  box-sizing: border-box;  
}  

/* ---------------------------------------------------------  
   ตัวกรอง  
   --------------------------------------------------------- */  

.history-filter {  
  background: var(--surface, #ffffff);  
  border: 1px solid var(--border, #e5e7eb);  
  border-radius: 16px;  
  padding: 16px;  
  margin-bottom: 16px;  
}  

.history-filter__title {  
  font-size: 16px;  
  font-weight: 700;  
  margin-bottom: 12px;  
}  

.history-date-row {  
  display: grid;  
  grid-template-columns: 1fr 1fr;  
  gap: 10px;  
}  

.history-field {  
  display: flex;  
  flex-direction: column;  
  gap: 6px;  
}  

.history-field label {  
  font-size: 13px;  
  color: var(--muted, #64748b);  
}  

.history-field input,  
.history-field select,  
.history-search {  
  width: 100%;  
  min-height: 46px;  
  box-sizing: border-box;  

  border: 1px solid var(--border, #d1d5db);  
  border-radius: 10px;  

  padding: 10px 12px;  

  font-family: inherit;  
  font-size: 15px;  

  background: #fff;  
  color: #111827;  
}  

.history-search-wrap {  
  margin-top: 12px;  
}  

.history-type-row {  
  display: flex;  
  gap: 8px;  
  overflow-x: auto;  

  margin-top: 12px;  
  padding-bottom: 3px;  
}  

.history-type-row .chip {  
  flex: 0 0 auto;  
}  

.history-actions {  
  display: grid;  
  grid-template-columns: 1fr 1fr;  
  gap: 10px;  
  margin-top: 14px;  
}  

/* ---------------------------------------------------------  
   สรุป  
   --------------------------------------------------------- */  

.history-summary {  
  display: grid;  
  grid-template-columns: repeat(3, 1fr);  
  gap: 10px;  
  margin-bottom: 16px;  
}  

.history-summary__item {  
  background: var(--surface, #ffffff);  
  border: 1px solid var(--border, #e5e7eb);  
  border-radius: 14px;  
  padding: 12px;  
}  

.history-summary__label {  
  font-size: 12px;  
  color: var(--muted, #64748b);  
}  

.history-summary__value {  
  font-size: 20px;  
  font-weight: 700;  
  margin-top: 4px;  
}  

/* ---------------------------------------------------------  
   รายการ  
   --------------------------------------------------------- */  

.history-list {  
  background: var(--surface, #ffffff);  
  border: 1px solid var(--border, #e5e7eb);  
  border-radius: 16px;  
  overflow: hidden;  
}  

.history-list__head {  
  padding: 14px 16px;  
  border-bottom: 1px solid var(--border, #e5e7eb);  

  display: flex;  
  align-items: center;  
  justify-content: space-between;  
  gap: 10px;  
}  

.history-list__title {  
  font-size: 16px;  
  font-weight: 700;  
}  

.history-count {  
  font-size: 13px;  
  color: var(--muted, #64748b);  
}  

.history-results {  
  padding: 0;  
}  

.history-row {  
  display: grid;  
  grid-template-columns: 42px 1fr auto;  

  gap: 10px;  
  align-items: center;  

  padding: 14px 16px;  

  border-bottom: 1px solid var(--border, #e5e7eb);  
}  

.history-row:last-child {  
  border-bottom: 0;  
}  

.history-row__icon {  
  width: 38px;  
  height: 38px;  

  display: flex;  
  align-items: center;  
  justify-content: center;  

  border-radius: 12px;  
  background: #f1f5f9;  

  font-size: 18px;  
}  

.history-row__name {  
  font-weight: 600;  
  font-size: 15px;  
}  

.history-row__meta {  
  margin-top: 3px;  
  color: var(--muted, #64748b);  
  font-size: 12px;  
  line-height: 1.5;  
}  

.history-row__right {  
  text-align: right;  
  min-width: 75px;  
}  

.history-row__delta {  
  font-size: 17px;  
  font-weight: 700;  
}  

.history-row__balance {  
  margin-top: 3px;  
  color: var(--muted, #64748b);  
  font-size: 11px;  
}  

.history-empty {  
  padding: 40px 20px;  
  text-align: center;  
  color: var(--muted, #64748b);  
}  

/* ---------------------------------------------------------  
   ปุ่ม  
   --------------------------------------------------------- */  

.history-back {  
  min-height: 42px;  
  padding: 8px 14px;  

  border: 1px solid var(--border, #d1d5db);  
  border-radius: 10px;  

  background: #fff;  
  color: #111827;  

  font-family: inherit;  
  font-size: 14px;  
  font-weight: 600;  

  cursor: pointer;  
}  

.history-print {  
  min-height: 46px;  
  border: 0;  
  border-radius: 10px;  

  background: #0f172a;  
  color: #fff;  

  font-family: inherit;  
  font-size: 15px;  
  font-weight: 600;  

  cursor: pointer;  
}  

.history-clear {  
  min-height: 46px;  
  border: 1px solid var(--border, #d1d5db);  
  border-radius: 10px;  

  background: #fff;  
  color: #111827;  

  font-family: inherit;  
  font-size: 15px;  
  font-weight: 600;  

  cursor: pointer;  
}  

/* ---------------------------------------------------------  
   Desktop  
   --------------------------------------------------------- */  

@media (min-width: 700px) {  

  .history-container {  
    padding: 24px;  
  }  

  .history-filter {  
    padding: 20px;  
  }  

  .history-date-row {  
    grid-template-columns: 220px 220px;  
  }  

  .history-search-wrap {  
    max-width: 500px;  
  }  

  .history-actions {  
    max-width: 400px;  
  }  

  .history-row {  
    grid-template-columns: 50px 1fr 120px;  
  }  
}  

/* ---------------------------------------------------------  
   Print  
   เตรียมไว้สำหรับขั้นตอนทำหน้าพิมพ์  
   --------------------------------------------------------- */  

@media print {  

  .history-header {  
    position: static;  
  }  

  .history-filter,  
  .history-back,  
  .history-print,  
  .history-clear {  
    display: none !important;  
  }  

  .history-container {  
    max-width: none;  
    padding: 0;  
  }  

  .history-list {  
    border: 0;  
    border-radius: 0;  
  }  

  .history-list__head {  
    border-bottom: 2px solid #000;  
  }  

  .history-row {  
    break-inside: avoid;  
  }  

  body {  
    background: #fff !important;  
  }  
}

</style></head><body>  <div class="history-page"><!-- =======================================================  
HEADER  
======================================================= -->

<header class="history-header">    <div class="history-header__top">  <div>  
  <h1 class="history-title">  
    ประวัติรายการ  
  </h1>  

  <div class="history-subtitle">  
    ประวัติการเคลื่อนไหวสินค้า  
  </div>  
</div>  

<button  
  type="button"  
  class="history-back"  
  id="backBtn"  
>  
  ← กลับ  
</button>

  </div>  </header>  <!-- =======================================================  
     CONTENT  
     ======================================================= -->  <main class="history-container">    <!-- =====================================================  
       FILTER  
       ===================================================== -->    <section class="history-filter">  <div class="history-filter__title">  
  ค้นหาประวัติ  
</div>  


<!-- วันที่ -->  

<div class="history-date-row">  

  <div class="history-field">  
    <label for="startDate">  
      วันที่เริ่มต้น  
    </label>  

    <input  
      id="startDate"  
      type="date"  
    >  
  </div>  


  <div class="history-field">  
    <label for="endDate">  
      วันที่สิ้นสุด  
    </label>  

    <input  
      id="endDate"  
      type="date"  
    >  
  </div>  

</div>  


<!-- ค้นหา -->  

<div class="history-search-wrap">  

  <div class="history-field">  

    <label for="searchInput">  
      ค้นหาสินค้า / SKU / คลัง / ผู้ทำรายการ  
    </label>  

    <input  
      id="searchInput"  
      class="history-search"  
      type="search"  
      placeholder="พิมพ์คำที่ต้องการค้นหา..."  
      autocomplete="off"  
    >  

  </div>  

</div>  


<!-- ประเภท -->  

<div  
  class="history-type-row"  
  id="historyTypes"  
>  

  <button  
    class="chip is-active"  
    type="button"  
    data-type="all"  
  >  
    ทั้งหมด  
  </button>  

  <button  
    class="chip"  
    type="button"  
    data-type="initial"  
  >  
    เพิ่มเข้า  
  </button>  

  <button  
    class="chip"  
    type="button"  
    data-type="issue"  
  >  
    เบิกออก  
  </button>  

  <button  
    class="chip"  
    type="button"  
    data-type="receive"  
  >  
    รับเข้า  
  </button>  

  <button  
    class="chip"  
    type="button"  
    data-type="adjust"  
  >  
    ปรับยอด  
  </button>  

  <button  
    class="chip"  
    type="button"  
    data-type="transfer"  
  >  
    ย้ายคลัง  
  </button>  

  <button  
    class="chip"  
    type="button"  
    data-type="archive"  
  >  
    สินค้าออกจากระบบ  
  </button>  

</div>  


<!-- ปุ่ม -->  

<div class="history-actions">  

  <button  
    type="button"  
    class="history-clear"  
    id="clearBtn"  
  >  
    ล้างการค้นหา  
  </button>  

  <button  
    type="button"  
    class="history-print"  
    id="printBtn"  
  >  
    🖨️ พิมพ์รายงาน  
  </button>  

</div>

  </section>    <!-- =====================================================  
       SUMMARY  
       ===================================================== -->    <section  
    class="history-summary"  
    id="historySummary"  
  >  <div class="history-summary__item">  

  <div class="history-summary__label">  
    รายการ  
  </div>  

  <div  
    class="history-summary__value"  
    id="totalCount"  
  >  
    0  
  </div>  

</div>  


<div class="history-summary__item">  

  <div class="history-summary__label">  
    รับเข้า  
  </div>  

  <div  
    class="history-summary__value"  
    id="receiveCount"  
  >  
    0  
  </div>  

</div>  


<div class="history-summary__item">  

  <div class="history-summary__label">  
    เบิก / ย้ายออก  
  </div>  

  <div  
    class="history-summary__value"  
    id="issueCount"  
  >  
    0  
  </div>  

</div>

  </section>    <!-- =====================================================  
       HISTORY LIST  
       ===================================================== -->    <section class="history-list">  <div class="history-list__head">  

  <div class="history-list__title">  
    รายการเคลื่อนไหว  
  </div>  

  <div  
    class="history-count"  
    id="historyCount"  
  >  
    0 รายการ  
  </div>  

</div>  


<div  
  class="history-results"  
  id="historyResults"  
>  

  <div class="history-empty">  
    กำลังโหลดข้อมูล...  
  </div>  

</div>

  </section>  </main>    </div>  <!-- =========================================================  
       JAVASCRIPT  
       ========================================================= -->  <script src="/history.js"></script></body>
