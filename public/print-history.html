<!DOCTYPE html><html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">  <title>พิมพ์ประวัติการเคลื่อนไหว</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, "Tahoma", sans-serif;
      color: #111;
      background: #fff;
    }

    .print-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .print-header h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .print-header p {
      margin: 4px 0;
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .toolbar button {
      padding: 10px 18px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #f5f5f5;
      cursor: pointer;
      font-size: 14px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th,
    td {
      border: 1px solid #999;
      padding: 8px;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #eee;
      text-align: center;
      white-space: nowrap;
    }

    .number {
      text-align: right;
    }

    .center {
      text-align: center;
    }

    .loading,
    .empty,
    .error {
      text-align: center;
      padding: 30px;
    }

    .error {
      color: #c00;
    }

    @media print {

  body {
    padding: 0;
    margin: 0;
  }

  .toolbar {
    display: none;
  }

  .print-header {
    margin-bottom: 12px;
  }

  table {
    font-size: 11px;
  }

  th,
  td {
    padding: 5px;
  }

  /* A4 */
  @page {
    size: A4 landscape;
    margin: 10mm;
  }

  body.paper-A4 {
    width: 100%;
  }

  /* เครื่องพิมพ์ใบเสร็จ 80 mm */
  body.paper-80mm {
    width: 80mm;
  }

  body.paper-80mm table {
    width: 100%;
    font-size: 9px;
  }

  body.paper-80mm th,
  body.paper-80mm td {
    padding: 3px;
  }

  /* เครื่องพิมพ์ใบเสร็จ 58 mm */
  body.paper-58mm {
    width: 58mm;
  }

  body.paper-58mm table {
    width: 100%;
    font-size: 8px;
  }

  body.paper-58mm th,
  body.paper-58mm td {
    padding: 2px;
  }

  /* ให้กระดาษใบเสร็จเป็นแนวตั้ง */
  @page {
    margin: 5mm;
  }
}
  </style></head><body>  <div class="toolbar">
    <select id="paperSize">
  <option value="A4">A4</option>
  <option value="80mm">80 mm</option>
  <option value="58mm">58 mm</option>
</select>
    <button type="button" onclick="window.print()">🖨️ พิมพ์</button>
    <button type="button" onclick="window.close()">✕ ปิด</button>
  </div>  <div class="print-header">
    <h1>รายงานประวัติ</h1><p id="dateRange">
  กำลังโหลด...
</p>

  </div>  <div id="printContent">
    <div class="loading">
      กำลังโหลดรายการ...
    </div>
  </div><script>
async function loadPrintHistory() {

  const params = new URLSearchParams(window.location.search);

  const startDate = params.get('startDate') || '';
  const endDate = params.get('endDate') || '';

  const apiParams = new URLSearchParams();

  apiParams.set('limit', '200');

  if (startDate) {
    apiParams.set('startDate', startDate);
  }

  if (endDate) {
    apiParams.set('endDate', endDate);
  }

  // แสดงช่วงวันที่ด้านบน
  if (startDate || endDate) {

    let text = '';

    if (startDate && endDate) {
      text = `วันที่ ${startDate} ถึง ${endDate}`;
    } else if (startDate) {
      text = `ตั้งแต่วันที่ ${startDate}`;
    } else {
      text = `ถึงวันที่ ${endDate}`;
    }

    document.getElementById('dateRange').textContent = text;

  } else {

    document.getElementById('dateRange').textContent =
      'ประวัติการเคลื่อนไหวทั้งหมด';

  }

  try {

    const response = await fetch(
      `/api/movements?${apiParams.toString()}`,
      {
        credentials: 'same-origin'
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || `เกิดข้อผิดพลาด (${response.status})`
      );
    }

    renderTable(data);

  } catch (error) {

    console.error(error);

    document.getElementById('printContent').innerHTML = `
      <div class="error">
        ไม่สามารถโหลดรายการได้<br>
        <small>${escapeHtml(error.message)}</small>
      </div>
    `;
  }
}


function renderTable(rows) {

  const container = document.getElementById('printContent');

  if (!Array.isArray(rows) || rows.length === 0) {

    container.innerHTML = `
      <div class="empty">
        ไม่พบรายการในช่วงวันที่เลือก
      </div>
    `;

    return;
  }

  const html = `
    <div class="table-wrap">
      <table>

        <thead>
          <tr>
            <th>ลำดับ</th>
            <th>วันที่ / เวลา</th>
            <th>สินค้า</th>
            <th>ประเภท</th>
            <th>คลัง</th>
            <th>จำนวน</th>
            <th>คงเหลือ</th>
            <th>ผู้ทำรายการ</th>
            <th>หมายเหตุ</th>
          </tr>
        </thead>

        <tbody>
          ${rows.map((row, index) => {

            const meta = getMovementMeta(row);

            return `
              <tr>

                <td class="center">
                  ${index + 1}
                </td>

                <td>
                  ${formatDate(row.created_at)}
                </td>

                <td>
                  ${escapeHtml(row.product_name)}
                </td>

                <td class="center">
                  ${meta}
                </td>

                <td>
                  ${escapeHtml(row.location_name)}
                </td>

                <td class="number">
                  ${formatQty(row.delta)}
                </td>

                <td class="number">
                  ${formatQty(row.balance_after)}
                </td>

                <td>
                  ${escapeHtml(row.actor_name || '-')}
                </td>

                <td>
                  ${escapeHtml(row.note || '')}
                </td>

              </tr>
            `;

          }).join('')}
        </tbody>

      </table>
    </div>
  `;

  container.innerHTML = html;
}


function getMovementMeta(row) {

  const isInitialAdd =
    row.type === 'receive' &&
    row.note === 'จำนวนเริ่มต้นตอนเพิ่มสินค้า';

  if (isInitialAdd) {
    return 'เพิ่มเข้า';
  }

  const labels = {
    issue: 'เบิกออก',
    receive: 'รับเข้า',
    adjust: 'ปรับยอด',
    transfer: 'ย้ายคลัง',
    transfer_in: 'ย้ายเข้า',
    transfer_out: 'ย้ายออก',
    archive: 'สินค้าออกจากระบบ'
  };

  return labels[row.type] || row.type || '-';
}


function formatQty(value) {

  const number = Number(value) || 0;

  return number.toLocaleString('th-TH', {
    maximumFractionDigits: 3
  });
}


function formatDate(value) {

  if (!value) return '-';

  const date = new Date(
    String(value).replace(' ', 'T') + 'Z'
  );

  if (Number.isNaN(date.getTime())) {
    return escapeHtml(value);
  }

  return date.toLocaleString('th-TH', {
    timeZone: 'Asia/Bangkok',
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit'
  });
}


function escapeHtml(value) {

  return String(value ?? '').replace(
    /[&<>"']/g,
    function (char) {
      return {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char];
    }
  );
}

document.getElementById('paperSize').addEventListener('change', (e) => {
  document.body.classList.remove('paper-A4', 'paper-80mm', 'paper-58mm');

  document.body.classList.add(
    `paper-${e.target.value}`
  );
});
    document.body.classList.add('paper-A4');
loadPrintHistory();
</script></body>
</html>
